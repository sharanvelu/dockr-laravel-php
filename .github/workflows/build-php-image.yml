# This is a basic workflow to help you get started with Actions

name: Build PHP Image

run-name: Build PHP ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PHP version to build (e.g. 8.4.2)"
        required: true
        type: string

jobs:
  validate-php-version:
    name: Validate version
    runs-on: ubuntu-latest

    outputs:
      docker_image_tag: ${{ steps.vars.outputs.docker_image_tag }}

    steps:
      - name: Validate PHP version and set Docker Image Tag
        id: vars
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid PHP version: $VERSION" >&2
            exit 1
          fi
          echo "docker_image_tag=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: validate-php-version

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ needs.validate-php-version.outputs.docker_image_tag }}
          outputs: type=image,name=sharanvelu/laravel-php,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-push:
    name: Publish multi-arch image
    needs: [validate-php-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG="sharanvelu/laravel-php:${{ needs.validate-php-version.outputs.docker_image_tag }}"
          docker buildx imagetools create -t "$TAG" \
            $(printf 'sharanvelu/laravel-php@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "sharanvelu/laravel-php:${{ needs.validate-php-version.outputs.docker_image_tag }}"
