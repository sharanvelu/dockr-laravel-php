# This is a basic workflow to help you get started with Actions

name: DockerBuild

on:
  push:
    branches: ["*"]

jobs:
  extract-docker-image-tag:
    if: ${{ startsWith(github.ref_name, 'php-') }}
    runs-on: ubuntu-latest

    outputs:
      docker_image_tag: ${{ steps.vars.outputs.docker_image_tag }}

    steps:
      - name: Extract Docker Image Tag from branch name
        id: vars
        shell: bash
        run: echo "docker_image_tag=${GITHUB_REF#refs/heads/php\-}" >> "$GITHUB_OUTPUT"

  build-and-push-docker-image:
    needs: extract-docker-image-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v5,linux/arm/v7,linux/arm64/v8
          push: true
          tags: sharanvelu/laravel-php:${{ needs.extract-docker-image-tag.outputs.docker_image_tag }}

  delete-branch:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Delete the branch this run is on
        if: ${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref_name != 'template' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deleting branch: ${BRANCH}"
          # Delete the git ref: refs/heads/<branch>
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}"