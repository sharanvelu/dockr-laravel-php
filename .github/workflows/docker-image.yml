# This is a basic workflow to help you get started with Actions

name: DockerBuild

on:
  push:
    branches: ["*"]

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  extract-docker-image-tag:
    if: ${{ startsWith(github.ref_name, 'php-') }}
    runs-on: ubuntu-latest

    outputs:
      docker_image_tag: ${{ steps.vars.outputs.docker_image_tag }}

    steps:
      - name: Extract Docker Image Tag from branch name
        id: vars
        shell: bash
        run: echo "docker_image_tag=${GITHUB_REF#refs/heads/php\-}" >> "$GITHUB_OUTPUT"

  build:
    needs: extract-docker-image-tag
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=sharanvelu/laravel-php,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-push:
    needs: [extract-docker-image-tag, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG="sharanvelu/laravel-php:${{ needs.extract-docker-image-tag.outputs.docker_image_tag }}"
          docker buildx imagetools create -t "$TAG" \
            $(printf 'sharanvelu/laravel-php@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "sharanvelu/laravel-php:${{ needs.extract-docker-image-tag.outputs.docker_image_tag }}"

  delete-branch:
    needs: merge-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Delete the branch this run is on
        if: ${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref_name != 'template' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deleting branch: ${BRANCH}"
          # Delete the git ref: refs/heads/<branch>
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}"
