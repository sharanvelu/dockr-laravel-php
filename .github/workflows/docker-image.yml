# This is a basic workflow to help you get started with Actions

name: DockerBuild

on:
  push:
    branches: ["*"]

jobs:
  build-and-push-docker-image:
    if: ${{ startsWith(github.ref_name, 'php-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/php\-})"
        id: extract_branch

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: sharanvelu/laravel-php:${{ steps.extract_branch.outputs.branch }}

  delete-branch:
    if: ${{ startsWith(github.ref_name, 'php-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch this run is on
        if: ${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref_name != 'template' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deleting branch: ${BRANCH}"
          # Delete the git ref: refs/heads/<branch>
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}"